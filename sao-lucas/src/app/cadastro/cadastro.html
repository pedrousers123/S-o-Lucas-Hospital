<div class="cadastro-page">

  <div class="cadastro-card">

    <div class="logo">

      <div class="logo-icon">
        +
      </div>

      <div>
        <h1>São Lucas</h1>
        <span>Gestão Hospitalar</span>
      </div>

    </div>


    <h2>Criar uma conta</h2>

    <p class="subtitle">
      Cadastre seus dados para acessar o sistema.
    </p>


    <form (ngSubmit)="cadastrar()">

      <div class="form-group">

        <label for="nome">
          Nome completo
        </label>

        <input
          id="nome"
          type="text"
          [(ngModel)]="nome"
          name="nome"
          placeholder="Digite seu nome completo"
          required
        >

      </div>


      <div class="form-group">

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="seuemail@exemplo.com"
          required
        >

      </div>


      <div class="form-group">

        <label for="senha">
          Senha
        </label>

        <input
          id="senha"
          type="password"
          [(ngModel)]="senha"
          name="senha"
          placeholder="Mínimo de 6 caracteres"
          required
        >

      </div>


      <div class="form-group">

        <label for="tipo">
          Tipo de usuário
        </label>

        <select
          id="tipo"
          [(ngModel)]="tipo"
          name="tipo"
        >

          <option value="Administrador">
            Administrador
          </option>

          <option value="Médico">
            Médico
          </option>

          <option value="Enfermagem">
            Enfermagem
          </option>

          <option value="Recepcionista">
            Recepcionista
          </option>

        </select>

      </div>


      @if (erro) {

        <div class="error-message">
          ⚠ {{ erro }}
        </div>

      }


      @if (mensagem) {

        <div class="success-message">
          ✓ {{ mensagem }}
        </div>

      }


      <button type="submit">
        Criar conta
      </button>

    </form>


    <div class="login-link">

      Já possui uma conta?

      <a
        routerLink="/login"
        class="back-link"
      >
        Voltar para o login
      </a>

    </div>

  </div>

</div>
